<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0a0820"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glowBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Circle background -->
  <circle cx="256" cy="256" r="244" fill="url(#bg)"/>

  <!-- Outer rings -->
  <circle cx="256" cy="256" r="242" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.2"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#818cf8" stroke-width="0.8" opacity="0.1"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#818cf8" stroke-width="0.8" opacity="0.08" stroke-dasharray="4 8"/>

  <!-- Orbital arcs - multiple -->
  <path d="M 320 90 A 190 190 0 0 1 422 192" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
  <path d="M 90 192 A 190 190 0 0 1 192 90" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
  <path d="M 192 422 A 190 190 0 0 1 90 320" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <path d="M 422 320 A 190 190 0 0 1 320 422" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>

  <!-- Inner orbital ring -->
  <path d="M 310 130 A 120 120 0 0 1 382 202" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.25" stroke-linecap="round"/>
  <path d="M 130 310 A 120 120 0 0 1 202 382" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.25" stroke-linecap="round"/>

  <!-- Hexagonal wireframe behind X -->
  <polygon points="256,115 378,185 378,327 256,397 134,327 134,185"
    fill="none" stroke="#6366f1" stroke-width="1" opacity="0.12"/>
  <polygon points="256,145 355,200 355,312 256,367 157,312 157,200"
    fill="none" stroke="#818cf8" stroke-width="0.7" opacity="0.08"/>

  <!-- Connecting lines from hex vertices to center -->
  <line x1="256" y1="115" x2="256" y2="220" stroke="#818cf8" stroke-width="0.8" opacity="0.15"/>
  <line x1="256" y1="397" x2="256" y2="292" stroke="#818cf8" stroke-width="0.8" opacity="0.15"/>
  <line x1="134" y1="185" x2="220" y2="230" stroke="#818cf8" stroke-width="0.8" opacity="0.12"/>
  <line x1="378" y1="185" x2="292" y2="230" stroke="#818cf8" stroke-width="0.8" opacity="0.12"/>
  <line x1="134" y1="327" x2="220" y2="282" stroke="#818cf8" stroke-width="0.8" opacity="0.12"/>
  <line x1="378" y1="327" x2="292" y2="282" stroke="#818cf8" stroke-width="0.8" opacity="0.12"/>

  <!-- X glow layer -->
  <line x1="148" y1="148" x2="364" y2="364" stroke="#818cf8" stroke-width="8" stroke-linecap="round" filter="url(#glow)" opacity="0.35"/>
  <line x1="364" y1="148" x2="148" y2="364" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" filter="url(#glow)" opacity="0.35"/>

  <!-- X main lines -->
  <line x1="148" y1="148" x2="364" y2="364" stroke="url(#purple)" stroke-width="4" stroke-linecap="round"/>
  <line x1="364" y1="148" x2="148" y2="364" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round"/>

  <!-- Cross lines through center (+ shape) -->
  <line x1="256" y1="175" x2="256" y2="337" stroke="#f472b6" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>
  <line x1="175" y1="256" x2="337" y2="256" stroke="#f472b6" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>

  <!-- Diagonal accent lines -->
  <line x1="190" y1="140" x2="160" y2="110" stroke="#a78bfa" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
  <line x1="322" y1="140" x2="352" y2="110" stroke="#67e8f9" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
  <line x1="190" y1="372" x2="160" y2="402" stroke="#67e8f9" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
  <line x1="322" y1="372" x2="352" y2="402" stroke="#a78bfa" stroke-width="1" opacity="0.2" stroke-linecap="round"/>

  <!-- Center hub - layered -->
  <circle cx="256" cy="256" r="24" fill="#6366f1" opacity="0.06" filter="url(#glowBig)"/>
  <circle cx="256" cy="256" r="16" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="256" r="8" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="3" fill="#22d3ee"/>

  <!-- Corner nodes -->
  <circle cx="148" cy="148" r="5" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="148" cy="148" r="2" fill="#c4b5fd"/>
  <circle cx="364" cy="148" r="5" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="364" cy="148" r="2" fill="#67e8f9"/>
  <circle cx="148" cy="364" r="5" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="148" cy="364" r="2" fill="#67e8f9"/>
  <circle cx="364" cy="364" r="5" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="364" cy="364" r="2" fill="#c4b5fd"/>

  <!-- Hex vertex nodes -->
  <circle cx="256" cy="115" r="3" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <circle cx="256" cy="115" r="1.2" fill="#a5b4fc" opacity="0.5"/>
  <circle cx="378" cy="185" r="3" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <circle cx="378" cy="185" r="1.2" fill="#a5b4fc" opacity="0.5"/>
  <circle cx="378" cy="327" r="3" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <circle cx="378" cy="327" r="1.2" fill="#a5b4fc" opacity="0.5"/>
  <circle cx="256" cy="397" r="3" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <circle cx="256" cy="397" r="1.2" fill="#a5b4fc" opacity="0.5"/>
  <circle cx="134" cy="327" r="3" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <circle cx="134" cy="327" r="1.2" fill="#a5b4fc" opacity="0.5"/>
  <circle cx="134" cy="185" r="3" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <circle cx="134" cy="185" r="1.2" fill="#a5b4fc" opacity="0.5"/>

  <!-- Data flow dots on X arms -->
  <circle cx="185" cy="185" r="1.5" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="210" cy="210" r="1" fill="#a5b4fc" opacity="0.5"/>
  <circle cx="235" cy="235" r="1.5" fill="#c4b5fd" opacity="0.6"/>
  <circle cx="277" cy="277" r="1.5" fill="#c4b5fd" opacity="0.6"/>
  <circle cx="302" cy="302" r="1" fill="#a5b4fc" opacity="0.5"/>
  <circle cx="327" cy="327" r="1.5" fill="#c4b5fd" opacity="0.7"/>

  <circle cx="327" cy="185" r="1.5" fill="#67e8f9" opacity="0.7"/>
  <circle cx="302" cy="210" r="1" fill="#67e8f9" opacity="0.5"/>
  <circle cx="277" cy="235" r="1.5" fill="#67e8f9" opacity="0.6"/>
  <circle cx="235" cy="277" r="1.5" fill="#67e8f9" opacity="0.6"/>
  <circle cx="210" cy="302" r="1" fill="#67e8f9" opacity="0.5"/>
  <circle cx="185" cy="327" r="1.5" fill="#67e8f9" opacity="0.7"/>

  <!-- Tiny scattered accent dots -->
  <circle cx="200" cy="155" r="1" fill="#f472b6" opacity="0.3"/>
  <circle cx="312" cy="155" r="1" fill="#f472b6" opacity="0.3"/>
  <circle cx="200" cy="357" r="1" fill="#f472b6" opacity="0.3"/>
  <circle cx="312" cy="357" r="1" fill="#f472b6" opacity="0.3"/>
  <circle cx="155" cy="256" r="1" fill="#22d3ee" opacity="0.25"/>
  <circle cx="357" cy="256" r="1" fill="#22d3ee" opacity="0.25"/>
</svg>
