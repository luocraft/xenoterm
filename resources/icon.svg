<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Terminal bracket > -->
  <polyline
    points="120,160 240,256 120,352"
    fill="none"
    stroke="url(#blueGrad)"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Cursor underscore _ -->
  <line
    x1="270" y1="352"
    x2="392" y2="352"
    stroke="url(#greenGrad)"
    stroke-width="36"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Network node dots -->
  <circle cx="420" cy="148" r="16" fill="#22d3ee" filter="url(#softGlow)" opacity="0.9"/>
  <circle cx="440" cy="232" r="10" fill="#60a5fa" filter="url(#softGlow)" opacity="0.6"/>
  <circle cx="410" cy="280" r="7" fill="#4ade80" filter="url(#softGlow)" opacity="0.5"/>

  <!-- Connecting lines from cursor area to nodes -->
  <line x1="392" y1="340" x2="420" y2="160" stroke="#22d3ee" stroke-width="2" opacity="0.3"/>
  <line x1="380" y1="340" x2="440" y2="238" stroke="#60a5fa" stroke-width="2" opacity="0.2"/>
</svg>
