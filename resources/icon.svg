<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Terminal window as the entire icon -->
  <rect width="512" height="512" rx="64" ry="64" fill="#1e1b4b"/>
  <!-- Terminal prompt > -->
  <text x="50" y="200" font-family="monospace" font-weight="bold" font-size="100" fill="#a5b4fc">❯</text>
  <!-- Code lines -->
  <rect x="170" y="160" width="60" height="10" rx="5" fill="#6366f1" opacity="0.6"/>
  <rect x="245" y="160" width="120" height="10" rx="5" fill="#818cf8" opacity="0.4"/>
  <rect x="170" y="185" width="160" height="10" rx="5" fill="#6366f1" opacity="0.3"/>
  <!-- Cursor -->
  <rect x="160" y="230" width="5" height="35" rx="2" fill="#a5b4fc"/>
  <!-- Network connection lines -->
  <g stroke="#4ade80" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
    <line x1="290" y1="350" x2="450" y2="350"/>
    <line x1="350" y1="350" x2="350" y2="310"/>
    <line x1="410" y1="350" x2="410" y2="310"/>
    <line x1="410" y1="350" x2="450" y2="390"/>
  </g>
  <!-- Network nodes -->
  <circle cx="290" cy="350" r="8" fill="#4ade80"/>
  <circle cx="350" cy="310" r="6" fill="#4ade80" opacity="0.8"/>
  <circle cx="410" cy="310" r="6" fill="#4ade80" opacity="0.8"/>
  <circle cx="450" cy="350" r="6" fill="#4ade80" opacity="0.6"/>
  <circle cx="450" cy="390" r="6" fill="#4ade80" opacity="0.6"/>
</svg>
