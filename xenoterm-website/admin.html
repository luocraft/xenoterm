<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>下载统计 · XenoTerm</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/site.css"></head><body>
<header class="shell header"><a class="brand" href="/"><img src="/icon.svg" alt="" width="34" height="34">XenoTerm</a><nav aria-label="管理导航"><a href="/">返回官网 ↗</a></nav></header>
<main class="shell admin-main"><div class="admin-title"><div><p class="eyebrow">管理后台</p><h1 style="font-size:38px;margin:0">下载统计</h1><p>查看官网下载与自动更新的使用情况。</p></div><div id="admin-actions" class="admin-actions" hidden><button class="button" id="refresh">刷新数据</button><button class="button" id="logout">退出</button></div></div>
<form id="login" class="login-box"><label for="token">管理密钥</label><input id="token" type="password" required autocomplete="current-password" placeholder="输入管理密钥"><button class="button primary" type="submit">查看统计</button><p class="login-note">统计数据仅供管理员查看。</p></form><p id="admin-error" class="error" role="alert" hidden></p>
<div id="dashboard" hidden><div class="stats-grid"><article class="stat-card"><p>累计下载</p><strong id="total">—</strong></article><article class="stat-card"><p>今日下载</p><strong id="today">—</strong></article><article class="stat-card"><p>官网下载</p><strong id="manual">—</strong></article><article class="stat-card"><p>自动更新下载</p><strong id="updates">—</strong></article></div>
<section class="chart-panel"><div class="panel-heading"><h2>每日下载</h2><label><span class="example-label">时间范围 </span><select id="days" aria-label="统计时间范围"><option value="7">近 7 天</option><option value="30" selected>近 30 天</option><option value="90">近 90 天</option></select></label></div><svg id="chart" class="chart" viewBox="0 0 1000 200" role="img" aria-label="每日下载量柱状图"></svg><div class="chart-meta"><span id="start-day"></span><span id="chart-total"></span><span id="end-day"></span></div><details><summary>查看每日明细</summary><div class="table-wrap"><table><thead><tr><th>日期</th><th>官网下载</th><th>自动更新</th><th>合计</th></tr></thead><tbody id="daily-table"></tbody></table></div></details></section>
<section class="table-panel"><div class="panel-heading"><h2>按版本统计</h2><span class="example-label">累计</span></div><div class="table-wrap"><table><thead><tr><th>版本</th><th>官网下载</th><th>自动更新下载</th><th>更新检查</th><th>下载合计</th></tr></thead><tbody id="versions"></tbody></table></div></section>
<p class="stats-note">统计口径：成功响应的安装包下载请求；同一客户端、同一文件在 30 分钟内合并计数。断点续传的后续分片、HEAD 检查和失败请求不计入。此数值不代表安装人数。日期按北京时间；升级前保留的历史记录沿用原统计口径。</p><p class="stats-note" id="updated-at" role="status"></p></div></main><script src="/admin.js" defer></script></body></html>
